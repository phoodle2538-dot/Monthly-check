<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>매달 할 일 체크</title>

<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="할일체크">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    --bg:#0f1420; --card:#181f2e; --card2:#1f2838; --line:#2b3547;
    --txt:#e8edf5; --dim:#8e9bb0; --dim2:#5d6b81;
    --pri:#5b9dff; --pri-d:#1e3a5f;
    --ok:#34d399; --ok-d:#123528;
    --warn:#fbbf24; --warn-d:#3a2e0e;
    --late:#fb923c; --late-d:#3a2410;
    --bad:#f87171;
    --shadow:0 4px 20px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f6fa; --card:#fff; --card2:#f1f4f9; --line:#e2e7f0;
      --txt:#141a24; --dim:#63708a; --dim2:#9aa6ba;
      --pri:#2563eb; --pri-d:#dbeafe;
      --ok:#059669; --ok-d:#d1fae5;
      --warn:#d97706; --warn-d:#fef3c7;
      --late:#ea580c; --late-d:#ffedd5;
      --bad:#dc2626;
      --shadow:0 2px 14px rgba(20,30,60,.08);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",
      "Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
    display:flex;flex-direction:column;min-height:100dvh;
  }
  button,input{font-family:inherit}

  /* ================= 앱바 ================= */
  .appbar{position:sticky;top:0;z-index:10;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 0;border-bottom:1px solid var(--line)}
  .titlerow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .titlerow h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.3px;flex:1}
  .titlerow h1 span{color:var(--pri)}
  .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--dim);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .iconbtn:active{transform:scale(.93)}
  .iconbtn.on{background:var(--pri-d);color:var(--pri);border-color:var(--pri)}

  .tabs{display:flex;gap:0;margin:0 -14px;padding:0 14px;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:11px 0 10px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--dim);font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:-1px}
  .tab.on{color:var(--pri);border-bottom-color:var(--pri)}

  .subbar{padding:10px 0}

  .monthbar{display:flex;align-items:center;gap:6px}
  .navbtn{width:40px;height:44px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:19px;cursor:pointer;flex-shrink:0}
  .navbtn:active{transform:scale(.94)}
  .monthbtn{flex:1;height:44px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:17px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .monthbtn:active{transform:scale(.98)}
  .badge-now{font-size:10px;font-weight:700;color:var(--pri);background:var(--pri-d);
    padding:2px 6px;border-radius:5px}

  .progress{margin-top:10px}
  .ptop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .ptop b{color:var(--txt);font-variant-numeric:tabular-nums}
  .bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--ok));
    border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}

  /* 계획 칩 */
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:8px 13px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);color:var(--dim);font-size:12.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .chip .cdot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
  .chip.on{background:var(--pri-d);color:var(--pri);border-color:var(--pri)}
  .chip.add{border-style:dashed;color:var(--dim2)}

  /* ================= 본문 ================= */
  main{flex:1;padding:14px 14px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sec{margin-bottom:16px}
  .sechead{display:flex;align-items:center;gap:7px;margin:0 2px 8px;font-size:12px;font-weight:800;color:var(--dim)}
  .sechead .cdot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
  .sechead .cnt{margin-left:auto;font-weight:700;color:var(--dim2);font-variant-numeric:tabular-nums}

  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  thead th{background:var(--card2);font-size:11px;color:var(--dim);font-weight:700;
    padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  thead th.c{text-align:center;width:50px}
  thead th.r{width:44px}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:none}
  tbody td{padding:0;vertical-align:middle}

  td.chk{width:50px;text-align:center}
  .cbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--dim2);background:transparent;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;
    font-size:15px;transition:all .16s;padding:0}
  .cbox:active{transform:scale(.88)}
  .cbox.on{background:var(--ok);border-color:var(--ok)}
  .cbox span{opacity:0;transform:scale(.5);transition:all .16s;font-weight:900;line-height:1}
  .cbox.on span{opacity:1;transform:scale(1)}

  td.name{padding:10px 4px 10px 0}
  .tname{font-size:14.5px;font-weight:600;line-height:1.4;word-break:break-all;
    background:none;border:none;color:var(--txt);padding:0;text-align:left;width:100%}
  tr.done .tname{opacity:.42;text-decoration:line-through}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .tg{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;line-height:1.5}
  .tg.moved{color:var(--late);background:var(--late-d)}
  .tg.late{color:var(--warn);background:var(--warn-d)}
  .tg.ontime{color:var(--ok);background:var(--ok-d)}
  tr.done .tags{opacity:.55}

  td.act{width:44px;text-align:center}
  .actbtn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;
    color:var(--dim);font-size:15px;cursor:pointer}
  .actbtn:active{transform:scale(.88)}
  .actbtn.del{color:var(--bad)}

  .empty{text-align:center;color:var(--dim2);font-size:13px;padding:26px 16px;
    background:var(--card);border:1px dashed var(--line);border-radius:14px;line-height:1.75}

  /* ===== 대분류 홈 ===== */
  .catcard{background:var(--card);border:1px solid var(--line);border-radius:15px;
    overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
  .cathead{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--card2);
    border-bottom:1px solid var(--line)}
  .cathead .cdot{width:10px;height:10px;border-radius:99px;flex-shrink:0}
  .cathead .nm{flex:1;font-size:14.5px;font-weight:800;word-break:break-all}
  .cathead .ct{font-size:11px;color:var(--dim);font-weight:700;flex-shrink:0}
  .cathead button{width:28px;height:28px;border-radius:8px;border:none;background:transparent;
    color:var(--dim);font-size:13px;cursor:pointer;flex-shrink:0}
  .trow2{display:flex;align-items:center;gap:9px;padding:11px 14px;
    border-bottom:1px solid var(--line);cursor:pointer;width:100%;
    background:none;border-left:none;border-right:none;border-top:none;color:var(--txt);text-align:left}
  .trow2:last-child{border-bottom:none}
  .trow2:active{background:var(--card2)}
  .trow2 .tn{flex:1;font-size:13.5px;font-weight:600;word-break:break-all}
  .trow2 .last{font-size:11px;color:var(--dim);font-weight:500;margin-top:2px;display:block}
  .trow2 .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;
    background:var(--card2);color:var(--dim);flex-shrink:0}
  .trow2 .badge.has{background:var(--ok-d);color:var(--ok)}
  .trow2 .arw{color:var(--dim2);font-size:14px;flex-shrink:0}
  .addtrack{width:100%;padding:11px 14px;background:none;border:none;border-top:1px dashed var(--line);
    color:var(--dim2);font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
  .addtrack:active{background:var(--card2)}
  .newcat{width:100%;padding:14px;border-radius:14px;border:1px dashed var(--line);
    background:transparent;color:var(--dim);font-size:13.5px;font-weight:700;cursor:pointer;
    margin-bottom:8px}

  /* ===== 기록 시트 ===== */
  .logform{display:flex;gap:7px;margin-bottom:12px}
  .logform input[type=date]{width:130px;height:44px;padding:0 9px;border-radius:11px;
    border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;outline:none}
  .logform input[type=text]{flex:1;height:44px;padding:0 12px;border-radius:11px;
    border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;
    outline:none;min-width:0}
  .logform input:focus{border-color:var(--pri)}
  .logadd{width:100%;padding:13px;border-radius:12px;border:none;background:var(--pri);
    color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;margin-bottom:16px}
  .logadd:active{transform:scale(.98)}
  .loglist{display:flex;flex-direction:column;gap:7px}
  .logit{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .logit .dt{font-size:11.5px;font-weight:800;color:var(--pri);width:46px;flex-shrink:0;
    font-variant-numeric:tabular-nums}
  .logit .tx{flex:1;font-size:13.5px;font-weight:600;word-break:break-all}
  .logit button{width:28px;height:28px;border-radius:7px;border:none;background:transparent;
    color:var(--bad);font-size:13px;cursor:pointer;flex-shrink:0}
  .yeargrp{font-size:11.5px;color:var(--dim);font-weight:800;margin:14px 2px 7px}

  /* ===== 연간 기록 격자 ===== */
  .lgwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;margin-bottom:6px}
  table.lg{border:none;border-radius:0;box-shadow:none;min-width:520px}
  table.lg th,table.lg td{border-bottom:1px solid var(--line)}
  table.lg thead th{padding:8px 0;text-align:center;font-size:10.5px}
  table.lg th.sticky,table.lg td.sticky{position:sticky;left:0;background:var(--card);z-index:1;
    width:118px;max-width:118px}
  table.lg thead th.sticky{background:var(--card2);text-align:left;padding-left:12px}
  table.lg td.sticky{font-size:12.5px;font-weight:600;padding:8px 10px 8px 12px;
    border-right:1px solid var(--line);word-break:break-all}
  table.lg td.cell{text-align:center;padding:0}
  .lcell{width:100%;height:36px;border:none;background:transparent;cursor:pointer;
    font-size:12px;color:var(--dim2);font-weight:800}
  .lcell.on{color:var(--ok)}
  .lcell.now{background:var(--pri-d)}
  .lcell:active{opacity:.5}

  .mlogs{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow)}
  .mlrow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .mlrow:last-child{border-bottom:none}
  .mlrow.cur{background:var(--pri-d)}
  .mllab{width:38px;flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--dim);padding-top:2px}
  .mlrow.cur .mllab{color:var(--pri)}
  .mlitems{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .mli{font-size:13px;line-height:1.5;word-break:break-all}
  .mli .d{color:var(--pri);font-weight:800;font-variant-numeric:tabular-nums;margin-right:5px}
  .mli .t2{color:var(--dim);font-size:11.5px;font-weight:700}
  .mlnone{color:var(--dim2);font-size:12.5px}

  /* ===== 연간 보기 ===== */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
  .sbox{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center}
  .sbox .n{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .sbox .l{font-size:10px;color:var(--dim);margin-top:3px}
  .sbox.ok .n{color:var(--ok)} .sbox.mv .n{color:var(--late)} .sbox.rest .n{color:var(--dim)}

  .yearrow2{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
  .yearrow2 button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:15px;cursor:pointer}
  .yearrow2 b{font-size:16px;font-variant-numeric:tabular-nums;min-width:70px;text-align:center}

  .ylist{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow)}
  .mrow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .mrow:last-child{border-bottom:none}
  .mrow:active{background:var(--card2)}
  .mrow.cur{background:var(--pri-d)}
  .mlabel{width:38px;flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--dim);padding-top:2px}
  .mrow.cur .mlabel{color:var(--pri)}
  .mitems{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .mnone{color:var(--dim2);font-size:12.5px;padding-top:1px}
  .mi{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;line-height:1.45}
  .mi .st{flex-shrink:0;font-size:12px;width:15px;text-align:center;padding-top:1px}
  .mi.ghost{opacity:.45;font-size:12.5px}
  .mi.ghost .t{text-decoration:line-through}
  .mi .t{word-break:break-all;min-width:0}
  .mi .sub{color:var(--dim);font-size:11px;font-weight:600}
  .mi.d .t{opacity:.5;text-decoration:line-through}

  /* 반복 매트릭스 */
  .mxwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
  table.mx{border:none;border-radius:0;box-shadow:none;min-width:520px}
  table.mx th,table.mx td{border-bottom:1px solid var(--line)}
  table.mx thead th{padding:8px 0;text-align:center;font-size:10.5px}
  table.mx thead th:first-child{text-align:left;padding-left:12px;width:118px}
  table.mx th.sticky,table.mx td.sticky{position:sticky;left:0;background:var(--card);z-index:1;
    width:118px;max-width:118px}
  table.mx thead th.sticky{background:var(--card2)}
  table.mx td.sticky{font-size:12.5px;font-weight:600;padding:8px 10px 8px 12px;
    border-right:1px solid var(--line);word-break:break-all}
  table.mx td.cell{text-align:center;padding:0}
  .mcell{width:100%;height:36px;border:none;background:transparent;cursor:pointer;
    font-size:13px;color:var(--dim2)}
  .mcell.on{color:var(--ok);font-weight:900}
  .mcell.pre{color:var(--line);opacity:.7}
  .mcell.now{background:var(--pri-d)}
  .mcell:active{opacity:.5}

  /* ================= 입력바 ================= */
  .addbar{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);
    padding:9px 14px calc(env(safe-area-inset-bottom) + 10px)}
  .addbar .chips{margin-bottom:8px}
  .inrow{display:flex;gap:8px}
  .inrow input{flex:1;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:16px;outline:none;min-width:0}
  .inrow input:focus{border-color:var(--pri)}
  .inrow input::placeholder{color:var(--dim2)}
  .addbtn{width:56px;height:46px;border-radius:12px;border:none;background:var(--pri);
    color:#fff;font-size:15px;font-weight:800;cursor:pointer;flex-shrink:0}
  .addbtn:active{transform:scale(.95)}

  /* ================= 시트 ================= */
  .sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;
    display:none;align-items:flex-end;justify-content:center}
  .sheet-ov.show{display:flex;animation:fade .18s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
    padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
    animation:up .26s cubic-bezier(.2,.9,.3,1.05);max-height:86dvh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grab{width:38px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font-size:15px;text-align:center;font-weight:800}
  .sheet .desc{margin:0 0 14px;font-size:12px;color:var(--dim);text-align:center;line-height:1.6}
  .yearrow{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
  .yearrow button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:16px;cursor:pointer}
  .yearrow b{font-size:19px;font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mgrid button{padding:14px 0;border-radius:11px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;position:relative}
  .mgrid button.sel{background:var(--pri);border-color:var(--pri);color:#fff}
  .mgrid button.now{border-color:var(--pri)}
  .mgrid button.plan{border-color:var(--late);color:var(--late)}
  .mgrid button i{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:99px;background:var(--ok)}
  .menulist{display:flex;flex-direction:column;gap:8px}
  .menulist button{display:flex;align-items:center;gap:11px;padding:14px;border-radius:12px;
    border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;
    font-weight:600;cursor:pointer;text-align:left;width:100%}
  .menulist button .em{font-size:17px;width:22px;text-align:center;flex-shrink:0}
  .menulist button small{display:block;color:var(--dim);font-size:11.5px;font-weight:500;margin-top:2px}
  .menulist button.danger{color:var(--bad)}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);
    transform:translateX(-50%) translateY(14px);background:var(--txt);color:var(--bg);
    padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;
    pointer-events:none;transition:all .22s;z-index:60;max-width:88%;text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:560px){
    body{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="titlerow">
    <h1>매달 <span>할 일</span> 체크</h1>
    <button class="iconbtn" id="btnEdit" title="편집">✎</button>
    <button class="iconbtn" id="btnMenu" title="메뉴">☰</button>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabCat">🗂 대분류</button>
    <button class="tab" id="tabMonth">📅 월별</button>
    <button class="tab" id="tabPlan">📊 연간</button>
  </div>

  <!-- 월별 탭 상단 -->
  <div class="subbar" id="barMonth">
    <div class="monthbar">
      <button class="navbtn" id="prevM">‹</button>
      <button class="monthbtn" id="monthBtn"><span id="monthTxt"></span></button>
      <button class="navbtn" id="nextM">›</button>

      <div class="ptop"><span id="pLabel"></span><span><b id="pDone">0</b> / <b id="pTotal">0</b></span></div>

  <!-- 계획별 탭 상단 -->

  <div class="chips" id="addChips"></div>
  <div class="inrow">
    <input id="newTask" type="text" placeholder="할 일을 입력하세요" autocomplete="off" enterkeyhint="done" maxlength="80">

<!-- 월 선택 -->
<div class="sheet-ov" id="mSheet">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="mSheetTitle">월 선택</h3>
    <p class="desc" id="mSheetDesc"></p>

</div>

<!-- 세부항목 기록 -->
<div class="sheet-ov" id="tSheet">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="tTitle"></h3>
    <p class="desc" id="tDesc"></p>
    <div class="logform">
      <input type="date" id="logDate">
      <input type="text" id="logText" maxlength="60" placeholder="무엇을 했나요? (예: 향수 선물)" enterkeyhint="done">

        border:1px solid var(--line);background:var(--card2);color:var(--bad);
        font-size:13px;font-weight:700;cursor:pointer">세부항목 삭제</button>
    </div>
  </div>
</div>

<!-- 메뉴 -->
<div class="sheet-ov" id="menuSheet">
  <div class="sheet">
    <div class="grab"></div>
    <h3>메뉴</h3>
    <div class="menulist">
      <button id="mToday"><span class="em">📅</span><span>이번 달로 이동<small id="todayLabel"></small></span></button>
      <button id="mCarry"><span class="em">↪</span><span>지난달 미완료 넘겨받기<small>원래 계획한 달은 기록으로 남습니다</small></span></button>
      <button id="mNewCat"><span class="em">➕</span><span>새 대분류 만들기<small>예: 고전 읽기, 운동, 자격증 공부</small></span></button>
      <button id="mExport"><span class="em">💾</span><span>백업 파일 내려받기<small>모든 데이터를 JSON으로 저장</small></span></button>
      <button id="mImport"><span class="em">📂</span><span>백업 파일 불러오기<small>다른 기기에서 옮겨올 때</small></span></button>
      <button id="mResetMonth" class="danger"><span class="em">↺</span><span>이번 달 체크 초기화<small>체크만 지우고 할 일은 유지</small></span></button>
    </div>
    <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   1. 저장 / 데이터 구조
   ---------------------------------------------------------
   cats  : [{id, name, color}]                     계획(유형)
   rec   : [{id, title, catId}]                    매달 반복되는 할 일
   recChk: { "2026-08": { 할일id: true } }          반복 항목의 달별 체크
   items : [{ id, catId, title,
              plan,      // 최초 계획한 달  ← 절대 바뀌지 않음
              cur,       // 현재 배정된 달  ← 연기하면 바뀜
              hist:[],   // 거쳐온 달 기록
              done, doneAt }]                      계획 항목(1회성)
   ========================================================= */
var KEY = "monthly-check-v1";   // 기존 저장 키를 그대로 사용(데이터 이어짐)

var COLORS = ["#5b9dff","#a78bfa","#34d399","#fbbf24","#fb923c","#22d3ee","#f472b6","#a3e635"];

function loadRaw(){
  try{ var r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* --- 예전 버전 데이터를 새 구조로 옮기기 --- */
function nowKeyStatic(){
  var n = new Date(), m = n.getMonth()+1;
  return n.getFullYear() + "-" + (m<10?"0":"") + m;
}
function migrate(raw){
  var fresh = { v:3, cats:[], rec:[], recChk:{}, items:[], tracks:[], logs:[] };
  if(!raw) return fresh;
  if(raw.v === 2 || raw.v === 3){
    raw.cats = raw.cats || []; raw.rec = raw.rec || [];
    raw.recChk = raw.recChk || {}; raw.items = raw.items || [];
    raw.tracks = raw.tracks || [];        // 세부항목
    raw.logs   = raw.logs   || [];        // 실행 기록
    // 시작월이 없던 예전 저장본 보정
    var first = null;
    Object.keys(raw.recChk).forEach(function(k){ if(!first || k < first) first = k; });
    raw.rec.forEach(function(t){ if(!t.since) t.since = first || nowKeyStatic(); });
    raw.v = 3;
    return raw;
  }
  // v1 : { recurring:[], monthly:{}, checks:{} }
  var d = fresh;
  var recIds = {};
  // 예전 데이터에 남아 있는 가장 이른 달을 반복 할 일의 시작월로 삼습니다
  var earliest = null;
  Object.keys(raw.monthly || {}).concat(Object.keys(raw.checks || {})).forEach(function(k){
    if(!earliest || k < earliest) earliest = k;
  });
  (raw.recurring || []).forEach(function(t){
    recIds[t.id] = true;
    d.rec.push({ id:t.id, title:t.title, catId:null, since: earliest || nowKeyStatic() });
  });
  var checks = raw.checks || {};
  Object.keys(raw.monthly || {}).forEach(function(k){
    (raw.monthly[k] || []).forEach(function(t){
      var done = !!(checks[k] && checks[k][t.id]);
      d.items.push({ id:t.id, catId:null, title:t.title,
        plan:k, cur:k, hist:[], done:done, doneAt: done ? k : null });
    });
  });
  Object.keys(checks).forEach(function(k){
    Object.keys(checks[k] || {}).forEach(function(id){
      if(recIds[id]){ if(!d.recChk[k]) d.recChk[k] = {}; d.recChk[k][id] = true; }
    });
  });
  return d;
}

var data = migrate(loadRaw());
save();

/* =========================================================
   2. 상태
   ========================================================= */
var now  = new Date();
var cur  = { y: now.getFullYear(), m: now.getMonth()+1 };
var view = "cat";                   // cat | month | plan
var planCat = "__rec__";            // 계획별 탭에서 보고 있는 계획
var planYear = cur.y;
var addTarget = "__rec__";          // 입력바에서 고른 대상
var editMode = false;
var pick = { y: cur.y };
var moveTarget = null;              // 연기할 항목 id

function $(id){ return document.getElementById(id); }
function key(y,m){ return y + "-" + (m<10?"0":"") + m; }
function curKey(){ return key(cur.y, cur.m); }
function isNow(y,m){ return y===now.getFullYear() && m===now.getMonth()+1; }
function ky(k){ return parseInt(k.slice(0,4),10); }
function km(k){ return parseInt(k.slice(5),10); }
function kLabel(k){ return km(k) + "월"; }
function nextKey(k){ var y=ky(k), m=km(k)+1; if(m>12){m=1;y++;} return key(y,m); }
function nowKey(){ return key(now.getFullYear(), now.getMonth()+1); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function catById(id){
  for(var i=0;i<data.cats.length;i++) if(data.cats[i].id===id) return data.cats[i];
  return null;
}
function catName(id){ var c=catById(id); return c ? c.name : "기타"; }
function catColor(id){ var c=catById(id); return c ? c.color : "#8e9bb0"; }

/* =========================================================
   3. 동작
   ========================================================= */
function toggleRec(id){
  var k = curKey();
  if(!data.recChk[k]) data.recChk[k] = {};
  if(data.recChk[k][id]) delete data.recChk[k][id]; else data.recChk[k][id] = true;
  save(); render();
}
function recDone(k,id){ return !!(data.recChk[k] && data.recChk[k][id]); }

function itemById(id){
  for(var i=0;i<data.items.length;i++) if(data.items[i].id===id) return data.items[i];
  return null;
}
function toggleItem(id){
  var it = itemById(id); if(!it) return;
  it.done = !it.done;
  it.doneAt = it.done ? it.cur : null;
  save(); render();
  if(it.done && it.doneAt !== it.plan) toast("완료! (원래 " + kLabel(it.plan) + " 계획)");
}

/* 항목을 다른 달로 옮기기 — plan(최초 계획)은 그대로 둡니다 */
function moveItem(id, toKey){
  var it = itemById(id); if(!it) return;
  if(it.cur === toKey) return;
  it.hist = it.hist || [];
  if(it.hist.indexOf(it.cur) === -1) it.hist.push(it.cur);
  it.cur = toKey;
  if(it.done) it.doneAt = toKey;
  save(); render();
  toast(kLabel(toKey) + "로 옮겼어요 · " + kLabel(it.plan) + " 계획은 그대로 기록돼요");
}

function addTask(title){
  title = (title||"").trim();
  if(!title) return;
  if(addTarget === "__rec__"){
    data.rec.push({ id:uid(), title:title, catId:null, since: curKey() });
    toast(cur.m + "월부터 매달 반복해요");
  }else{
    var catId = (addTarget === "__etc__") ? null : addTarget;
    var k = curKey();
    data.items.push({ id:uid(), catId:catId, title:title,
      plan:k, cur:k, hist:[], done:false, doneAt:null });
    toast(cur.m + "월 · " + (catId ? catName(catId) : "기타") + "에 추가했어요");
  }
  save(); render();
}

function delRec(id){
  if(!confirm("매달 반복되는 할 일입니다.\n모든 달에서 삭제됩니다. 계속할까요?")) return;
  data.rec = data.rec.filter(function(t){ return t.id!==id; });
  Object.keys(data.recChk).forEach(function(k){ delete data.recChk[k][id]; });
  save(); render(); toast("삭제했어요");
}
function delItem(id){
  data.items = data.items.filter(function(t){ return t.id!==id; });
  save(); render(); toast("삭제했어요");
}
function rename(id, isRec){
  var obj = isRec ? null : itemById(id);
  if(isRec){ for(var i=0;i<data.rec.length;i++) if(data.rec[i].id===id) obj = data.rec[i]; }
  if(!obj) return;
  var v = prompt("할 일 수정", obj.title);
  if(v===null) return; v = v.trim(); if(!v) return;
  obj.title = v; save(); render();
}

function newCat(){
  var n = prompt("새 대분류 이름을 입력하세요.\n예) 고전 읽기, 운동, 자격증 공부");
  if(n===null) return; n = n.trim(); if(!n) return;
  var c = { id:uid(), name:n, color:COLORS[data.cats.length % COLORS.length] };
  data.cats.push(c);
  addTarget = c.id; planCat = c.id;
  save(); render();
  toast("「" + n + "」 대분류를 만들었어요");
  return c.id;
}

/* 지난달 미완료를 이번 달로 넘겨받기 */
function carryOver(){
  var pm = cur.m-1, py = cur.y;
  if(pm<1){ pm=12; py--; }
  var pk = key(py,pm), ck = curKey(), n = 0;
  data.items.forEach(function(it){
    if(it.cur===pk && !it.done){
      it.hist = it.hist || [];
      if(it.hist.indexOf(it.cur)===-1) it.hist.push(it.cur);
      it.cur = ck; n++;
    }
  });
  save(); render(); closeSheets();
  toast(n ? pm + "월 미완료 " + n + "건을 넘겨받았어요" : "넘겨받을 항목이 없어요");
}

function resetMonth(){
  if(!confirm(cur.m + "월의 체크를 모두 지웁니다.\n할 일 목록은 그대로 유지됩니다.")) return;
  var k = curKey();
  data.recChk[k] = {};
  data.items.forEach(function(it){ if(it.cur===k){ it.done=false; it.doneAt=null; } });
  save(); render(); closeSheets(); toast("체크를 초기화했어요");
}

function exportData(){
  var blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "할일체크-백업-" + curKey() + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  closeSheets(); toast("백업 파일을 저장했어요");
}
function importData(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || typeof d!=="object") throw 0;
      if(!("items" in d) && !("recurring" in d) && !("rec" in d)) throw 0;
      if(!confirm("현재 데이터를 덮어씁니다. 계속할까요?")) return;
      data = migrate(d); save(); render(); closeSheets(); toast("불러오기 완료");
    }catch(e){ alert("백업 파일 형식이 올바르지 않습니다."); }
  };
  r.readAsText(file);
}

/* =========================================================
   4. 화면 — 월별
   ========================================================= */
function renderMonth(){
  var k = curKey();
  $("monthTxt").innerHTML = cur.y + "년 " + cur.m + "월" +
    (isNow(cur.y,cur.m) ? ' <span class="badge-now">이번 달</span>' : "");

  var monthItems = data.items.filter(function(it){ return it.cur===k; });
  var recs = recForMonth(k);
  var total = recs.length + monthItems.length;
  var done = 0;
  recs.forEach(function(t){ if(recDone(k,t.id)) done++; });
  monthItems.forEach(function(it){ if(it.done) done++; });

  $("pDone").textContent = done; $("pTotal").textContent = total;
  var pct = total ? Math.round(done/total*100) : 0;
  $("pFill").style.width = pct + "%";
  $("pLabel").textContent = total===0 ? "할 일을 추가해 주세요"
    : (done===total ? "🎉 이번 달 완료!" : "진행률 " + pct + "%");

  var html = "";
  if(total===0){
    html = '<div class="empty">이 달에 등록된 할 일이 없어요.<br>' +
      '아래에서 <b>계획</b>을 고르고 할 일을 추가해 보세요.</div>';
  }else{
    if(recs.length) html += recSection(k, recs);
    // 계획별로 묶기
    data.cats.forEach(function(c){
      var list = monthItems.filter(function(it){ return it.catId===c.id; });
      if(list.length) html += itemSection(c.name, c.color, list);
    });
    var etc = monthItems.filter(function(it){ return !it.catId || !catById(it.catId); });
    if(etc.length) html += itemSection("기타", "#8e9bb0", etc);
  }
  $("main").innerHTML = html;
}

function recForMonth(k){
  return data.rec.filter(function(t){ return !t.since || t.since <= k; });
}
function recSection(k, recs){
  var doneN = 0;
  recs.forEach(function(t){ if(recDone(k,t.id)) doneN++; });
  var rows = recs.map(function(t){
    var d = recDone(k,t.id);
    return '<tr class="' + (d?"done":"") + '">' +
      '<td class="chk"><button class="cbox' + (d?" on":"") + '" data-a="rchk" data-i="' + t.id + '"><span>✓</span></button></td>' +
      '<td class="name"><button class="tname" data-a="rname" data-i="' + t.id + '">' + esc(t.title) + '</button></td>' +
      (editMode ? '<td class="act"><button class="actbtn del" data-a="rdel" data-i="' + t.id + '">🗑</button></td>' : '') +
      '</tr>';
  }).join("");
  return '<div class="sec"><div class="sechead"><span class="cdot" style="background:#a78bfa"></span>🔁 매달 반복' +
    '<span class="cnt">' + doneN + '/' + recs.length + '</span></div>' +
    '<table><thead><tr><th class="c">완료</th><th>할 일</th>' +
    (editMode?'<th class="r"></th>':'') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function itemSection(name, color, list){
  var doneN = 0; list.forEach(function(it){ if(it.done) doneN++; });
  var rows = list.map(function(it){
    var tags = "";
    if(it.cur !== it.plan) tags += '<span class="tg moved">↪ ' + kLabel(it.plan) + ' 계획</span>';
    if(it.done && it.doneAt && it.doneAt !== it.plan) tags += '<span class="tg late">지연 완료</span>';
    if(it.done && it.doneAt === it.plan) tags += '<span class="tg ontime">계획대로</span>';
    return '<tr class="' + (it.done?"done":"") + '">' +
      '<td class="chk"><button class="cbox' + (it.done?" on":"") + '" data-a="ichk" data-i="' + it.id + '"><span>✓</span></button></td>' +
      '<td class="name"><button class="tname" data-a="iname" data-i="' + it.id + '">' + esc(it.title) + '</button>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') + '</td>' +
      '<td class="act">' + (editMode
        ? '<button class="actbtn del" data-a="idel" data-i="' + it.id + '">🗑</button>'
        : '<button class="actbtn" data-a="imove" data-i="' + it.id + '" title="다른 달로 옮기기">↪</button>') +
      '</td></tr>';
  }).join("");
  return '<div class="sec"><div class="sechead"><span class="cdot" style="background:' + color + '"></span>' +
    esc(name) + '<span class="cnt">' + doneN + '/' + list.length + '</span></div>' +
    '<table><thead><tr><th class="c">완료</th><th>할 일</th><th class="r"></th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

/* =========================================================
   5. 화면 — 계획별(연간)
   ========================================================= */
function renderPlan(){
  // 칩
  var chips = '<button class="chip' + (planCat==="__rec__"?" on":"") + '" data-a="pcat" data-i="__rec__">' +
    '<span class="cdot" style="background:#a78bfa"></span>🔁 매달 반복</button>';
  data.cats.forEach(function(c){
    chips += '<button class="chip' + (planCat===c.id?" on":"") + '" data-a="pcat" data-i="' + c.id + '">' +
      '<span class="cdot" style="background:' + c.color + '"></span>' + esc(c.name) + '</button>';
  });
  var hasEtc = data.items.some(function(it){ return !it.catId || !catById(it.catId); });
  if(hasEtc) chips += '<button class="chip' + (planCat==="__etc__"?" on":"") + '" data-a="pcat" data-i="__etc__">' +
    '<span class="cdot" style="background:#8e9bb0"></span>기타</button>';
  chips += '<button class="chip add" data-a="newcat">＋ 새 대분류</button>';
  $("planChips").innerHTML = chips;

  var html = "";
  html += '<div class="yearrow2"><button data-a="ypv">‹</button><b>' + planYear + '년</b><button data-a="ynx">›</button></div>';

  if(planCat === "__rec__"){
    html += renderMatrix();
  }else{
    var trs = tracksOf(planCat);
    if(trs.length) html += renderLogYear(trs);
    var list = data.items.filter(function(it){
      if(planCat === "__etc__") return !it.catId || !catById(it.catId);
      return it.catId === planCat;
    });
    if(list.length || !trs.length){
      if(trs.length) html += '<div class="yeargrp">📌 월별 계획 항목</div>';
      html += renderYear(list);
    }
  }
  $("main").innerHTML = html;
}

/* ---- 세부항목 × 12개월 기록 격자 + 월별 기록 목록 ---- */
function renderLogYear(trs){
  var ids = trs.map(function(t){ return t.id; });
  var yearLogs = data.logs.filter(function(l){
    return ids.indexOf(l.trackId) !== -1 && l.date.slice(0,4) == planYear;
  });
  var months = {};
  yearLogs.forEach(function(l){ months[l.date.slice(0,7)] = true; });

  var html = '<div class="summary">' +
    '<div class="sbox"><div class="n">' + trs.length + '</div><div class="l">세부항목</div></div>' +
    '<div class="sbox ok"><div class="n">' + yearLogs.length + '</div><div class="l">올해 기록</div></div>' +
    '<div class="sbox mv"><div class="n">' + Object.keys(months).length + '</div><div class="l">기록한 달</div></div>' +
    '<div class="sbox rest"><div class="n">' +
      logsIn2(ids, key(now.getFullYear(), now.getMonth()+1)).length + '</div><div class="l">이번 달</div></div>' +
    '</div>';

  // 격자
  var head = '<tr><th class="sticky">세부항목</th>';
  for(var m=1;m<=12;m++) head += '<th>' + m + '</th>';
  head += '</tr>';
  var body = trs.map(function(t){
    var tds = '<td class="sticky">' + esc(t.name) + '</td>';
    for(var m=1;m<=12;m++){
      var k = key(planYear,m);
      var n = logsIn(t.id, k).length;
      var isNowCell = (planYear===now.getFullYear() && m===now.getMonth()+1);
      tds += '<td class="cell"><button class="lcell' + (n?" on":"") + (isNowCell?" now":"") +
        '" data-a="lgcell" data-i="' + t.id + '">' + (n ? n : "·") + '</button></td>';
    }
    return '<tr>' + tds + '</tr>';
  }).join("");
  html += '<div class="lgwrap"><table class="lg"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
    '<p style="font-size:11.5px;color:var(--dim);text-align:center;margin:8px 0 0;line-height:1.6">' +
    '숫자는 그 달의 기록 수예요 · 눌러서 기록을 보거나 추가할 수 있어요</p>';

  // 월별 기록 목록
  html += '<div class="yeargrp">📖 ' + planYear + '년에 한 일</div><div class="mlogs">';
  for(var m2=1;m2<=12;m2++){
    var k2 = key(planYear,m2);
    var ls = yearLogs.filter(function(l){ return l.date.slice(0,7)===k2; })
      .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var inner = "";
    if(ls.length){
      ls.forEach(function(l){
        var t = trackById(l.trackId);
        inner += '<div class="mli"><span class="d">' + shortDate(l.date) + '</span>' +
          esc(l.text) + ' <span class="t2">· ' + (t ? esc(t.name) : "") + '</span></div>';
      });
    }else{
      inner = '<div class="mlnone">―</div>';
    }
    var isCur = (planYear===now.getFullYear() && m2===now.getMonth()+1);
    html += '<div class="mlrow' + (isCur?" cur":"") + '">' +
      '<div class="mllab">' + m2 + '월</div><div class="mlitems">' + inner + '</div></div>';
  }
  return html + '</div>';
}
function logsIn2(ids, k){
  return data.logs.filter(function(l){
    return ids.indexOf(l.trackId) !== -1 && l.date.slice(0,7)===k;
  });
}

function renderYear(all){
  var inYear = all.filter(function(it){ return ky(it.cur)===planYear || ky(it.plan)===planYear; });
  var total = inYear.length;
  var doneN = 0, movedN = 0, onTime = 0;
  inYear.forEach(function(it){
    if(it.done) doneN++;
    if(it.cur !== it.plan) movedN++;
    if(it.done && it.doneAt === it.plan) onTime++;
  });

  var html = '<div class="summary">' +
    '<div class="sbox"><div class="n">' + total + '</div><div class="l">전체</div></div>' +
    '<div class="sbox ok"><div class="n">' + doneN + '</div><div class="l">완료</div></div>' +
    '<div class="sbox mv"><div class="n">' + movedN + '</div><div class="l">연기</div></div>' +
    '<div class="sbox rest"><div class="n">' + (total ? Math.round(onTime/total*100) : 0) + '%</div><div class="l">계획대로</div></div>' +
    '</div>';

  if(total === 0){
    return html + '<div class="empty">' + planYear + '년에 계획된 항목이 없어요.<br>' +
      '<b>월별</b> 탭에서 이 대분류를 골라 할 일을 추가해 보세요.</div>';
  }

  html += '<div class="ylist">';
  for(var m=1;m<=12;m++){
    var k = key(planYear, m);
    var here  = all.filter(function(it){ return it.cur===k; });
    var ghost = all.filter(function(it){ return it.plan===k && it.cur!==k; });
    var body = "";

    here.forEach(function(it){
      var st, cls = "";
      if(it.done){ st = "✅"; cls = " d"; }
      else if(k < nowKey()){ st = "⚠️"; }
      else { st = "⏳"; }
      var sub = "";
      if(it.plan !== k) sub = ' <span class="sub">(' + kLabel(it.plan) + ' 계획)</span>';
      body += '<div class="mi' + cls + '"><span class="st">' + st + '</span>' +
              '<span class="t">' + esc(it.title) + sub + '</span></div>';
    });
    ghost.forEach(function(it){
      body += '<div class="mi ghost"><span class="st">↪</span>' +
              '<span class="t">' + esc(it.title) + ' <span class="sub">→ ' + kLabel(it.cur) +
              (ky(it.cur)!==planYear ? "(" + ky(it.cur) + ")" : "") + '로 연기</span></span></div>';
    });
    if(!body) body = '<div class="mnone">―</div>';

    var isCur = (planYear===now.getFullYear() && m===now.getMonth()+1);
    html += '<div class="mrow' + (isCur?" cur":"") + '" data-a="gomonth" data-i="' + k + '">' +
      '<div class="mlabel">' + m + '월</div><div class="mitems">' + body + '</div></div>';
  }
  return html + '</div>';
}

function renderMatrix(){
  if(!data.rec.length){
    return '<div class="empty">매달 반복되는 할 일이 없어요.<br>' +
      '<b>월별</b> 탭에서 🔁 매달 반복을 골라 추가해 보세요.</div>';
  }
  var head = '<tr><th class="sticky">할 일</th>';
  for(var m=1;m<=12;m++) head += '<th>' + m + '</th>';
  head += '</tr>';

  var totalCells = 0, doneCells = 0;
  var body = data.rec.map(function(t){
    var since = t.since || "0000-00";
    var tds = '<td class="sticky">' + esc(t.title) + '</td>';
    for(var m=1;m<=12;m++){
      var k = key(planYear,m);
      var d = recDone(k,t.id);
      var pre = k < since;                                   // 시작하기 전의 달
      var isNowCell = (planYear===now.getFullYear() && m===now.getMonth()+1);
      if((!pre && k <= nowKey()) || d){ totalCells++; if(d) doneCells++; }
      tds += '<td class="cell"><button class="mcell' + (d?" on":"") + (pre?" pre":"") +
        (isNowCell?" now":"") + '" data-a="mx" data-i="' + t.id + '" data-k="' + k + '">' +
        (d ? "✓" : (pre ? "–" : "·")) + '</button></td>';
    }
    return '<tr>' + tds + '</tr>';
  }).join("");

  var sum = '<div class="summary">' +
    '<div class="sbox"><div class="n">' + data.rec.length + '</div><div class="l">항목</div></div>' +
    '<div class="sbox ok"><div class="n">' + doneCells + '</div><div class="l">완료</div></div>' +
    '<div class="sbox rest"><div class="n">' + (totalCells - doneCells) + '</div><div class="l">빠뜨림</div></div>' +
    '<div class="sbox rest"><div class="n">' + (totalCells ? Math.round(doneCells/totalCells*100) : 0) + '%</div><div class="l">달성률</div></div>' +
    '</div>';

  return sum + '<div class="mxwrap"><table class="mx"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
    '<p style="font-size:11.5px;color:var(--dim);text-align:center;margin:10px 0 0;line-height:1.6">' +
    '칸을 눌러 바로 체크할 수 있어요 · 지난 달까지만 달성률에 반영됩니다<br>' +
    '<b>–</b> 는 아직 시작하기 전의 달이며, 눌러서 시작 월을 앞당길 수 있어요</p>';
}

/* =========================================================
   대분류 홈  (대분류 > 세부항목)
   ========================================================= */
function tracksOf(catId){
  return data.tracks.filter(function(t){ return t.catId === catId; });
}
function logsOf(trackId){
  return data.logs.filter(function(l){ return l.trackId === trackId; });
}
function logsIn(trackId, k){          // k = "2026-08"
  return data.logs.filter(function(l){ return l.trackId===trackId && l.date.slice(0,7)===k; });
}
function shortDate(d){                // "2026-07-08" -> "7/8"
  return parseInt(d.slice(5,7),10) + "/" + parseInt(d.slice(8,10),10);
}
function todayStr(){
  var n = new Date(), m = n.getMonth()+1, d = n.getDate();
  return n.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (d<10?"0":"") + d;
}

function renderCatHome(){
  var k = curKey();
  var html = "";

  if(data.cats.length === 0){
    html += '<div class="empty">아직 대분류가 없어요.<br>' +
      '<b>부모님 챙기기</b>, <b>고전 읽기</b> 처럼<br>큰 갈래를 먼저 만들어 보세요.</div>' +
      '<div style="height:12px"></div>';
  }

  data.cats.forEach(function(c){
    var trs = tracksOf(c.id);
    html += '<div class="catcard">' +
      '<div class="cathead"><span class="cdot" style="background:' + c.color + '"></span>' +
      '<span class="nm">' + esc(c.name) + '</span>' +
      '<span class="ct">세부 ' + trs.length + '</span>' +
      (editMode ? '<button data-a="catren" data-i="' + c.id + '">✏️</button>' +
                  '<button data-a="catdel" data-i="' + c.id + '">🗑</button>' : '') +
      '</div>';

    if(trs.length === 0){
      html += '<div style="padding:14px;color:var(--dim2);font-size:12.5px;text-align:center">' +
              '세부항목을 추가해 주세요</div>';
    }
    trs.forEach(function(t){
      var all = logsOf(t.id);
      var mine = logsIn(t.id, k).length;
      var last = all.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; })[0];
      html += '<button class="trow2" data-a="track" data-i="' + t.id + '">' +
        '<span class="tn">' + esc(t.name) +
          (last ? '<span class="last">최근 · ' + shortDate(last.date) + " " + esc(last.text) + '</span>'
                : '<span class="last">아직 기록 없음</span>') +
        '</span>' +
        '<span class="badge' + (mine?" has":"") + '">이번 달 ' + mine + '</span>' +
        '<span class="arw">›</span></button>';
    });
    html += '<button class="addtrack" data-a="newtrack" data-i="' + c.id + '">＋ 세부항목 추가</button>';
    html += '</div>';
  });

  html += '<button class="newcat" data-a="newcat">＋ 새 대분류 만들기</button>';
  $("main").innerHTML = html;
}

/* --- 세부항목 / 대분류 편집 --- */
function newTrack(catId){
  var n = prompt("세부항목 이름을 입력하세요.\n예) 부모님 연락, 부모님 선물, 자녀 여행");
  if(n===null) return; n = n.trim(); if(!n) return;
  data.tracks.push({ id:uid(), catId:catId, name:n });
  save(); render(); toast("「" + n + "」 세부항목을 추가했어요");
}
function renameCat(id){
  var c = catById(id); if(!c) return;
  var v = prompt("대분류 이름 수정", c.name);
  if(v===null) return; v = v.trim(); if(!v) return;
  c.name = v; save(); render();
}
function delCat(id){
  var c = catById(id); if(!c) return;
  var trs = tracksOf(id);
  var nLog = 0; trs.forEach(function(t){ nLog += logsOf(t.id).length; });
  var msg = "「" + c.name + "」 대분류를 삭제할까요?";
  if(trs.length) msg += "\n세부항목 " + trs.length + "개와 기록 " + nLog + "건도 함께 삭제됩니다.";
  if(!confirm(msg)) return;
  var ids = trs.map(function(t){ return t.id; });
  data.logs   = data.logs.filter(function(l){ return ids.indexOf(l.trackId) === -1; });
  data.tracks = data.tracks.filter(function(t){ return t.catId !== id; });
  data.cats   = data.cats.filter(function(x){ return x.id !== id; });
  data.items.forEach(function(it){ if(it.catId===id) it.catId = null; });
  if(planCat === id) planCat = "__rec__";
  save(); render(); toast("삭제했어요");
}

/* --- 기록 시트 --- */
var curTrack = null;
function trackById(id){
  for(var i=0;i<data.tracks.length;i++) if(data.tracks[i].id===id) return data.tracks[i];
  return null;
}
function openTrack(id){
  var t = trackById(id); if(!t) return;
  curTrack = id;
  var c = catById(t.catId);
  $("tTitle").textContent = t.name;
  $("tDesc").textContent  = (c ? c.name : "기타") + " · 한 일을 기록해 두세요";
  $("logDate").value = todayStr();
  $("logText").value = "";
  renderLogs();
  openSheet($("tSheet"));
}
function renderLogs(){
  var list = logsOf(curTrack).slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  if(!list.length){
    $("logWrap").innerHTML = '<div class="empty">아직 기록이 없어요.<br>위에서 첫 기록을 남겨 보세요.</div>';
    return;
  }
  var html = "", year = null;
  list.forEach(function(l){
    var y = l.date.slice(0,4);
    if(y !== year){ year = y; html += '<div class="yeargrp">' + y + '년</div>'; }
    html += '<div class="logit"><span class="dt">' + shortDate(l.date) + '</span>' +
      '<span class="tx">' + esc(l.text) + '</span>' +
      '<button data-a="logdel" data-i="' + l.id + '">🗑</button></div>';
  });
  $("logWrap").innerHTML = '<div class="loglist">' + html + '</div>';
  bindMain();
}
function addLog(){
  var d = $("logDate").value, t = $("logText").value.trim();
  if(!d){ toast("날짜를 골라 주세요"); return; }
  if(!t){ toast("무엇을 했는지 적어 주세요"); return; }
  data.logs.push({ id:uid(), trackId:curTrack, date:d, text:t });
  save();
  $("logText").value = "";
  renderLogs(); render();
  toast(shortDate(d) + " · " + t + " 기록했어요");
}
function delLog(id){
  data.logs = data.logs.filter(function(l){ return l.id !== id; });
  save(); renderLogs(); render();
}

function bindMain(){
  var els = document.querySelectorAll("[data-a]");
  for(var i=0;i<els.length;i++){
    if(els[i]._b) continue;
    els[i]._b = 1;
    els[i].addEventListener("click", function(){
      var a = this.getAttribute("data-a"), id = this.getAttribute("data-i");
      switch(a){
        case "rchk":  toggleRec(id); break;
        case "ichk":  toggleItem(id); break;
        case "rname": editMode ? rename(id,true)  : toggleRec(id); break;
        case "iname": editMode ? rename(id,false) : toggleItem(id); break;
        case "rdel":  delRec(id); break;
        case "idel":  if(confirm("이 할 일을 삭제할까요?")) delItem(id); break;
        case "imove": openMove(id); break;
        case "pcat":  planCat = id; render(); break;
        case "acat":  addTarget = id; renderAddChips(); break;
        case "newcat": if(newCat()) render(); break;
        case "ypv":   planYear--; render(); break;
        case "ynx":   planYear++; render(); break;
        case "gomonth": cur.y = ky(id); cur.m = km(id); view="month"; render(); break;
        case "mx":    toggleMx(id, this.getAttribute("data-k")); break;
        case "track":    openTrack(id); break;
        case "newtrack": newTrack(id); break;
        case "catren":   renameCat(id); break;
        case "catdel":   delCat(id); break;
        case "logdel":   delLog(id); break;
        case "lgcell":   openTrack(id); break;
      }
    });
  }
}
function toggleMx(id, k){
  var t = null;
  for(var i=0;i<data.rec.length;i++) if(data.rec[i].id===id) t = data.rec[i];
  // 시작 전의 달을 누르면 시작 월을 앞당길지 물어봅니다
  if(t && t.since && k < t.since){
    if(!confirm("「" + t.title + "」을(를) " + kLabel(k) + "부터 시작한 것으로 바꿀까요?")) return;
    t.since = k; save(); render();
    toast(ky(k) + "년 " + kLabel(k) + "부터로 바꿨어요");
    return;
  }
  if(!data.recChk[k]) data.recChk[k] = {};
  if(data.recChk[k][id]) delete data.recChk[k][id]; else data.recChk[k][id] = true;
  save(); render();
}

/* --- 시트 --- */
function openSheet(el){ el.className = "sheet-ov show"; }
function closeSheets(){
  $("mSheet").className="sheet-ov"; $("menuSheet").className="sheet-ov"; $("tSheet").className="sheet-ov";
}
[$("mSheet"), $("menuSheet"), $("tSheet")].forEach(function(ov){
  ov.addEventListener("click", function(e){ if(e.target===ov) closeSheets(); });
});

function openMonthPick(){
  moveTarget = null;
  $("mSheetTitle").textContent = "월 선택";
  $("mSheetDesc").textContent = "";
  pick.y = cur.y; buildGrid(); openSheet($("mSheet"));
}
function openMove(id){
  var it = itemById(id); if(!it) return;
  moveTarget = id;
  $("mSheetTitle").textContent = "「" + it.title + "」 옮기기";
  $("mSheetDesc").innerHTML = "최초 계획인 <b>" + kLabel(it.plan) + "</b>은 기록으로 그대로 남습니다.";
  pick.y = ky(it.cur); buildGrid(); openSheet($("mSheet"));
}
function buildGrid(){
  $("yTxt").textContent = pick.y;
  var g = $("mGrid"); g.innerHTML = "";
  var it = moveTarget ? itemById(moveTarget) : null;
  for(var m=1;m<=12;m++){
    (function(m){
      var b = document.createElement("button");
      var k = key(pick.y,m);
      var cls = "";
      if(it){
        if(it.cur===k) cls = "sel";
        else if(it.plan===k) cls = "plan";
      }else{
        if(pick.y===cur.y && m===cur.m) cls = "sel";
        else if(isNow(pick.y,m)) cls = "now";
      }
      var has = data.items.some(function(x){ return x.cur===k; });
      b.className = cls;
      b.innerHTML = m + "월" + (has && !it ? "<i></i>" : "");
      b.addEventListener("click", function(){
        if(moveTarget) moveItem(moveTarget, k);
        else { cur.y = pick.y; cur.m = m; render(); }
        closeSheets();
      });
      g.appendChild(b);
    })(m);
  }
}

function toast(msg){
  var t = $("toast"); t.textContent = msg; t.className = "toast show";
  clearTimeout(t._h); t._h = setTimeout(function(){ t.className="toast"; }, 2200);
}

function goMonth(y,m){
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  cur.y=y; cur.m=m; render();
}

$("tabCat").addEventListener("click", function(){ view="cat"; render(); });
$("tabMonth").addEventListener("click", function(){ view="month"; render(); });
$("tabPlan").addEventListener("click", function(){ view="plan"; planYear=cur.y; render(); });

$("logAdd").addEventListener("click", addLog);
$("logText").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ e.preventDefault(); addLog(); this.blur(); }
});
$("tRename").addEventListener("click", function(){
  var t = trackById(curTrack); if(!t) return;
  var v = prompt("세부항목 이름 수정", t.name);
  if(v===null) return; v = v.trim(); if(!v) return;
  t.name = v; save(); $("tTitle").textContent = v; render(); toast("수정했어요");
});
$("tDelete").addEventListener("click", function(){
  var t = trackById(curTrack); if(!t) return;
  var n = logsOf(curTrack).length;
  var msg = "「" + t.name + "」 세부항목을 삭제할까요?";
  if(n) msg += "\n기록 " + n + "건도 함께 삭제됩니다.";
  if(!confirm(msg)) return;
  data.logs   = data.logs.filter(function(l){ return l.trackId !== curTrack; });
  data.tracks = data.tracks.filter(function(x){ return x.id !== curTrack; });
  save(); closeSheets(); render(); toast("삭제했어요");
});
$("prevM").addEventListener("click", function(){ goMonth(cur.y,cur.m-1); });
$("nextM").addEventListener("click", function(){ goMonth(cur.y,cur.m+1); });
$("monthBtn").addEventListener("click", openMonthPick);
$("yPrev").addEventListener("click", function(){ pick.y--; buildGrid(); });
$("yNext").addEventListener("click", function(){ pick.y++; buildGrid(); });

$("btnEdit").addEventListener("click", function(){
  editMode = !editMode; render();
  toast(editMode ? "편집 모드 · 이름을 누르면 수정돼요" : "편집 모드를 껐어요");
});

});
$("mToday").addEventListener("click", function(){ view="month"; goMonth(now.getFullYear(), now.getMonth()+1); closeSheets(); });
$("mCarry").addEventListener("click", carryOver);
$("mNewCat").addEventListener("click", function(){ closeSheets(); if(newCat()) render(); });
$("mExport").addEventListener("click", exportData);
$("mImport").addEventListener("click", function(){ $("fileIn").click(); });
$("fileIn").addEventListener("change", function(){ if(this.files[0]) importData(this.files[0]); this.value=""; });

$("addBtn").addEventListener("click", function(){ addTask($("newTask").value); $("newTask").value=""; });

});

/* 좌우 스와이프로 월 이동 (월별 탭에서만) */
(function(){
  var x0=null,y0=null;
  document.addEventListener("touchstart", function(e){
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchend", function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(view==="month" && Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.8){
      goMonth(cur.y, cur.m + (dx<0?1:-1));
    }
    x0=null;
  },{passive:true});
})();

/* =========================================================
   8. PWA 보조 (manifest.json 이 없을 때만 아이콘 직접 생성)
   ========================================================= */
function roundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function makeIcon(size){
  var c=document.createElement("canvas"); c.width=c.height=size;
  var g=c.getContext("2d"), s=size/512;
  var grad=g.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,"#3b82f6"); grad.addColorStop(1,"#8b5cf6");
  g.fillStyle=grad; g.fillRect(0,0,size,size);
  g.fillStyle="#fff"; roundRect(g,96*s,130*s,320*s,290*s,34*s); g.fill();
  g.fillStyle="rgba(0,0,0,.18)"; roundRect(g,96*s,130*s,320*s,66*s,34*s); g.fill();
  g.fillRect(96*s,172*s,320*s,24*s);
  g.fillStyle="#fff";
  roundRect(g,158*s,92*s,26*s,74*s,13*s); g.fill();
  roundRect(g,328*s,92*s,26*s,74*s,13*s); g.fill();
  g.strokeStyle="#22c55e"; g.lineWidth=40*s; g.lineCap="round"; g.lineJoin="round";
  g.beginPath(); g.moveTo(168*s,302*s); g.lineTo(232*s,362*s); g.lineTo(348*s,236*s); g.stroke();
  return c.toDataURL("image/png");
}
fetch("manifest.json").then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){
  try{
    var i192=makeIcon(192), i512=makeIcon(512);
    var old=document.querySelectorAll("link[rel=manifest],link[rel=icon],link[rel=apple-touch-icon]");
    for(var i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
    var ap=document.createElement("link"); ap.rel="apple-touch-icon"; ap.href=i192; document.head.appendChild(ap);
    var fv=document.createElement("link"); fv.rel="icon"; fv.href=i192; document.head.appendChild(fv);
    var mf={name:"매달 할 일 체크",short_name:"할일체크",start_url:".",scope:".",
      display:"standalone",orientation:"portrait",background_color:"#0f1420",
      theme_color:"#0f1420",lang:"ko",
      icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any"},
             {src:i512,sizes:"512x512",type:"image/png",purpose:"any"},
             {src:i512,sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    var ml=document.createElement("link"); ml.rel="manifest";
    ml.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(ml);
  }catch(e){}
});
